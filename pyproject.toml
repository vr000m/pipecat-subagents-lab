[project]
name = "pipecat-subagents-lab"
version = "0.1.0"
description = "Browser-first Pipecat web-search subagent laboratory"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[openai,webrtc,local,runner]==1.4.0",
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.0,<9",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "server"
