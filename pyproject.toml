[project]
name = "pipecat-subagents-lab"
version = "0.1.2"
description = "Browser-first Pipecat web-search subagent laboratory"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[cartesia,deepgram,openai,webrtc,runner]==1.6.0",
    "pydantic>=2.10,<3",
    "websockets>=16,<17",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.18,<2",
    "pytest>=8.0,<9",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

# Type checking is enforced per-module, not repo-wide. The rest of server/
# carries pre-existing errors (mostly Optional narrowing and untyped
# third-party seams) that are out of scope to fix here, so a repo-wide gate
# would be red on day one. The modules listed in the second override below
# check clean and are gated; everything else is reported-but-ignored until it
# is brought clean and moved up.
[tool.mypy]
python_version = "3.12"
files = ["server"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "server.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["server.perf_metrics", "server.pipeline", "server.work_item_coordinator"]
ignore_errors = false

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "server"
