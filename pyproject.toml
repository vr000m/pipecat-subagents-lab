[project]
name = "pipecat-subagents-lab"
version = "0.1.2"
description = "Browser-first Pipecat web-search subagent laboratory"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[cartesia,deepgram,openai,webrtc,runner]==1.6.0",
    "pydantic>=2.10,<3",
    "websockets>=16,<17",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.18,<2",
    "pytest>=8.0,<9",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

# Type checking is fail-closed: every module under server/ is checked by
# default, so a newly added file is gated automatically. The modules listed in
# the override below carry pre-existing errors (mostly Optional narrowing and
# untyped third-party seams) that are out of scope to fix here; that list is
# legacy debt to be burnt down, not policy. Shrink it as modules are brought
# clean; never extend it for new code.
[tool.mypy]
python_version = "3.12"
files = ["server"]
ignore_missing_imports = true

# Legacy debt: pre-existing errors, exempted until fixed. Do not add new entries.
[[tool.mypy.overrides]]
module = [
    "server.app",
    "server.config",
    "server.interruptions",
    "server.main_responder",
    "server.observers",
    "server.registry",
    "server.results",
    "server.router",
    "server.rtvi_messages",
    "server.services.stt",
    "server.services.tts",
    "server.speech_scheduler",
]
ignore_errors = true

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "server"
